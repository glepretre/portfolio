<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gilles Lepretre - Full-stack Developer Portfolio" />
    <title>Gilles Lepretre | Full-stack Developer</title>
  </head>
  <body class="text-gray-300 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">
    
    <main class="max-w-4xl w-full space-y-12 z-10">
      
      <!-- Hero Section -->
      <header class="text-center space-y-4">
        <div class="inline-block relative group">
            <h1 class="text-5xl md:text-7xl font-bold font-mono text-white tracking-tighter glitch-wrapper" data-text="Gilles Lepretre">
            Gilles Lepretre
            </h1>
            <div class="absolute -inset-1 bg-gradient-to-r from-neon-blue to-neon-purple opacity-20 group-hover:opacity-40 blur transition duration-1000 group-hover:duration-200"></div>
        </div>
        
        <div class="h-8 flex items-center justify-center">
          <span class="text-neon-blue font-mono text-xl md:text-2xl mr-2">></span>
          <span id="typing-text" class="font-mono text-xl md:text-2xl text-neon-purple border-r-2 border-neon-blue pr-1 animate-pulse"></span>
        </div>
      </header>

      <!-- Links Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 px-4">
        
        <!-- GitHub -->
        <a href="https://github.com/glepretre" target="_blank" rel="noopener noreferrer" class="glass-card p-6 rounded-xl flex items-center space-x-4 group">
          <div class="p-3 rounded-lg bg-white/5 group-hover:bg-white/10 transition-colors">
            <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold text-white group-hover:text-neon-blue transition-colors">GitHub</h2>
            <p class="text-sm text-gray-400">Check out my code</p>
          </div>
        </a>

        <!-- LinkedIn -->
        <a href="https://fr.linkedin.com/in/glepretre" target="_blank" rel="noopener noreferrer" class="glass-card p-6 rounded-xl flex items-center space-x-4 group">
          <div class="p-3 rounded-lg bg-white/5 group-hover:bg-white/10 transition-colors">
            <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" />
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold text-white group-hover:text-neon-blue transition-colors">LinkedIn</h2>
            <p class="text-sm text-gray-400">Connect professionally</p>
          </div>
        </a>

        <!-- StackOverflow -->
        <a href="https://stackoverflow.com/users/3049002/glepretre" target="_blank" rel="noopener noreferrer" class="glass-card p-6 rounded-xl flex items-center space-x-4 group">
          <div class="p-3 rounded-lg bg-white/5 group-hover:bg-white/10 transition-colors">
            <svg class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">

            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold text-white group-hover:text-neon-blue transition-colors">StackOverflow</h2>
            <p class="text-sm text-gray-400">My contributions</p>
          </div>
        </a>

        <!-- Resume -->
        <a href="https://glepretre.github.io/resume/dist/CV%20Gilles%20Lepretre.pdf" target="_blank" rel="noopener noreferrer" class="glass-card p-6 rounded-xl flex items-center space-x-4 group border-neon-purple/30 hover:border-neon-purple">
          <div class="p-3 rounded-lg bg-white/5 group-hover:bg-white/10 transition-colors">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
          <div>
            <h2 class="text-xl font-bold text-white group-hover:text-neon-purple transition-colors">Resume</h2>
            <p class="text-sm text-gray-400">Download PDF</p>
          </div>
        </a>

      </div>

      <footer class="text-center text-gray-600 text-sm font-mono pt-12">
        <p>Built with <span class="text-neon-blue">Vite</span> & <span class="text-neon-purple">Tailwind</span></p>
        <p class="mt-2">© 2026 Gilles Lepretre</p>
      </footer>

    </main>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/style.css"></script>
  </body>
</html>
